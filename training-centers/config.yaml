      enabled: false
      note: "Bên thứ ba — cần đọc điều khoản"

# ---------------------------------------------------------------------------
# Nguồn 3: Google Places API (New). Key: biến môi trường GOOGLE_PLACES_API_KEY.
# Điều khoản: chỉ place_id được lưu lâu dài; nội dung khác chỉ cache tạm.
# ---------------------------------------------------------------------------
google_places:
  enabled: true
  language_code: vi
  region_code: VN
  page_size: 20
  max_pages: 3                  # Text Search trả tối đa ~60 kết quả/truy vấn
  text_search_tier: pro         # ids_only | pro | enterprise (xem tcpipe/sources/google_places.py)
  content_cache_days: 30        # xóa nội dung Places (trừ place_id) sau số ngày này
  monthly_budget_usd: 50        # vượt ngưỡng thì dừng gọi API
  # Giá USD/1.000 request ở bậc 0–100k, free = số request miễn phí/tháng/SKU (từ 01/03/2025).
  pricing:
    text_search_ids_only:     {usd_per_1000: 0,  free_per_month: null}
    text_search_pro:          {usd_per_1000: 32, free_per_month: 5000}
    text_search_enterprise:   {usd_per_1000: 35, free_per_month: 1000}
    place_details_essentials: {usd_per_1000: 5,  free_per_month: 10000}
    place_details_pro:        {usd_per_1000: 17, free_per_month: 5000}
    place_details_enterprise: {usd_per_1000: 20, free_per_month: 1000}
  # Chiến lược quét: phường đô thị quét theo từng phường; xã nông thôn gộp theo cụm.
  # Chiến lược quét: truy vấn kèm tên xã/phường + tỉnh (không cần toạ độ).
  # Phường: đủ bộ places_queries (15 câu); xã: chỉ rural_queries; cộng 1 lượt cấp tỉnh.
  sweep:
    rural_queries: ["trung tâm ngoại ngữ", "trung tâm tin học", "luyện thi"]
    avg_pages_urban: 1.6        # số trang trung bình/truy vấn — hiệu chỉnh ở GĐ1
    avg_pages_rural: 1.1

# ---------------------------------------------------------------------------
# Quy mô (xem README mục "Công thức quy mô"). Đơn vị: số học viên đang theo học.
# ---------------------------------------------------------------------------
scale:
  buckets:                      # [tên, cận dưới (bao gồm)]
    - ["XS", 0]                 # < 100: dưới ngưỡng mục tiêu, vẫn giữ để lọc
    - ["S", 100]
    - ["M", 500]
    - ["L", 2000]
    - ["XL", 5000]
    - ["XXL", 20000]
  annual_to_active: 0.5         # "X học viên mỗi năm" → X × 0.5 đang học
  cumulative_growth_factor: 1.3 # tích lũy / số năm hoạt động × hệ số tăng trưởng
  cumulative_default_years: 8   # khi không biết năm thành lập
  learners_per_branch:          # chỉ áp dụng khi có từ 2 cơ sở trở lên
    ngoai_ngu: 350
    luyen_thi: 250
    tin_hoc_stem: 200
    ky_nang: 150
    khac: 150
  learners_per_teacher: 25
  learners_per_review: 8        # số đánh giá Google (tổng các cơ sở) × hệ số
  disagreement_steps: 2         # tín hiệu phụ lệch >= 2 bậc thì hạ độ tin cậy

status:
  recent_activity_months: 12
