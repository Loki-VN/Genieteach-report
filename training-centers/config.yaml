business_registry:
  vsic_codes:            # VSIC 2025 (QĐ 36/2025/QĐ-TTg, hiệu lực 15/11/2025)
    "8559": "Giáo dục khác chưa được phân vào đâu"
    "8551": "Giáo dục thể thao và giải trí"
    "8552": "Giáo dục văn hóa nghệ thuật"
    "856x": "Dịch vụ hỗ trợ giáo dục (mã cấp 4 cần đối chiếu Phụ lục QĐ 36/2025)"
  portals:
    - name: dangkykinhdoanh
      base_url: "https://dangkykinhdoanh.gov.vn"
      enabled: false
      note: "Cổng quốc gia; NĐ 01/2021 Điều 36: tra cứu miễn phí tên, mã DN, địa chỉ, ngành nghề, người đại diện, tình trạng"
    - name: masothue
      base_url: "https://masothue.com"
