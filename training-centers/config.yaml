# Cấu hình pipeline trung tâm đào tạo ngoài nhà trường.
# Mọi đường dẫn tương đối tính từ thư mục training-centers/.

paths:
  db: data/centers.sqlite
  raw_cache: data/cache/raw          # HTML/PDF/XLSX thô
  reports: reports
  logs: logs

crawl:
  # Email liên hệ ghép vào User-Agent lấy từ biến môi trường CRAWLER_CONTACT_EMAIL (chỉ ký tự ASCII).
  user_agent: "GenieTeachResearchBot/0.1 (+market research; contact: {contact})"
  min_delay_seconds: 2.0             # tối thiểu giữa 2 request cùng domain
  timeout_seconds: 30
  max_retries: 4                     # backoff 2s, 4s, 8s, 16s (+ jitter)
  backoff_base_seconds: 2
  backoff_max_seconds: 60
  respect_robots: true
  raw_cache_ttl_days: 30             # cache HTML/PDF thô của website trung tâm, Sở
  max_pages_per_site: 8
  use_playwright: false              # chỉ bật khi trang bắt buộc render JS

# ---------------------------------------------------------------------------
# Loại hình trung tâm. category = khóa cấp 1; subjects = môn/chứng chỉ.
# keywords: dùng để phân loại tên/mô tả (so khớp không dấu, chữ thường).
# places_queries: câu truy vấn Text Search cho Google Places.
# ---------------------------------------------------------------------------
categories:
  ngoai_ngu:
    label: "ngoại ngữ"
    subjects:
      "tiếng Anh": ["tieng anh", "anh ngu", "anh van", "english"]
      "tiếng Trung": ["tieng trung", "tieng hoa", "hoa ngu", "trung van", "hoa van", "chinese", "re:(?i)hán ngữ"]
      "tiếng Nhật": ["tieng nhat", "nhat ngu", "nhat ban", "japanese", "japan", "nihongo"]
      "tiếng Hàn": ["tieng han", "han quoc", "korean", "korea", "re:(?i)hàn ngữ"]
      "tiếng Pháp": ["tieng phap", "phap ngu", "francais", "french"]
      "tiếng Đức": ["tieng duc", "duc ngu", "deutsch", "german"]
      "ngôn ngữ khác": ["tieng nga", "tieng tay ban nha", "tieng thai", "tieng y "]
    places_queries:
      - "trung tâm tiếng Anh"
      - "trung tâm ngoại ngữ"
      - "trung tâm tiếng Trung"
      - "trung tâm tiếng Nhật"
      - "trung tâm tiếng Hàn"
      - "trung tâm tiếng Pháp tiếng Đức"
  luyen_thi:
    label: "luyện thi"
    subjects:
      "IELTS": ["re:IELTS|[Ii]elts"]
      "TOEIC": ["re:TOEIC|[Tt]oeic"]
      "TOEFL": ["re:TOEFL"]
      "SAT": ["re:\\bSAT\\b"]
      "HSK": ["re:\\bHSK\\b"]
      "JLPT": ["re:\\bJLPT\\b"]
      "TOPIK": ["re:\\bTOPIK\\b"]
      "vào lớp 10": ["vao lop 10", "thi vao 10", "on thi lop 10", "luyen thi lop 10"]
      "đại học": ["luyen thi dai hoc", "on thi dai hoc", "thi thpt", "danh gia nang luc", "dgnl"]
      "bồi dưỡng văn hóa": ["boi duong kien thuc", "boi duong van hoa", "day them", "on luyen van hoa"]
    places_queries:
      - "luyện thi IELTS"
      - "luyện thi TOEIC"
      - "luyện thi vào lớp 10"
      - "luyện thi đại học"
  tin_hoc_stem:
    label: "tin học-STEM"
    subjects:
      "tin học": ["tin hoc", "tin hoc van phong", "computer", "cong nghe", "technology"]
      "lập trình": ["lap trinh", "coding", "code", "programming"]
      "STEM/robotics": ["re:\\bSTEA?M\\b", "robotics", "robot"]
    places_queries:
      - "trung tâm tin học"
      - "lập trình cho trẻ em"
      - "trung tâm STEM robotics"
  ky_nang:
    label: "kỹ năng"
    subjects:
      "kỹ năng sống": ["ky nang song", "ki nang song", "re:\\bKNS\\b", "giao duc ky nang", "boi duong ky nang",
                       "phat trien ky nang", "ngoai gio chinh khoa"]
      "kỹ năng mềm": ["ky nang mem", "soft skill", "thuyet trinh", "lanh dao", "huan luyen ky nang", "ky nang lam viec"]
      "toán tư duy": ["toan tu duy", "tu duy toan", "mathnasium", "ucmas", "abacus", "soroban", "pomath"]
    places_queries:
      - "trung tâm kỹ năng sống"
      - "đào tạo kỹ năng mềm"

